{{- if .Values.ingress.enabled }}
{{- $host := required "ingress.host is required when ingress.enabled=true" .Values.ingress.host }}
{{- $hosts := prepend .Values.ingress.extraHosts $host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "typo3.fullname" . }}
  labels:
    {{- include "typo3.componentLabels" (dict "ctx" . "component" "app") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        {{- range $hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ default (printf "%s-ingress-tls" (include "typo3.fullname" .)) .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    {{- range $hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "typo3.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
