{{- if and .Values.secrets.externalSecret.enabled (not .Values.secrets.existingSecret) }}
{{- $es := .Values.secrets.externalSecret }}
{{- $keys := .Values.secrets.keys }}
{{- $remoteKey := required "secrets.externalSecret.remoteKey is required" $es.remoteKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "typo3.fullname" . }}-secrets
  labels:
    {{- include "typo3.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind }}
    name: {{ required "secrets.externalSecret.secretStoreRef.name is required" $es.secretStoreRef.name }}
  target:
    name: {{ include "typo3.fullname" . }}-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- if not .Values.database.host }}
    - secretKey: {{ $keys.dbHost }}
      remoteRef: { key: {{ $remoteKey | quote }}, property: {{ $es.properties.dbHost | quote }} }
    {{- end }}
    - secretKey: {{ $keys.dbUser }}
      remoteRef: { key: {{ $remoteKey | quote }}, property: {{ $es.properties.dbUser | quote }} }
    - secretKey: {{ $keys.dbPassword }}
      remoteRef: { key: {{ $remoteKey | quote }}, property: {{ $es.properties.dbPassword | quote }} }
    - secretKey: {{ $keys.encryptionKey }}
      remoteRef: { key: {{ $remoteKey | quote }}, property: {{ $es.properties.encryptionKey | quote }} }
    {{- if .Values.valkey.enabled }}
    - secretKey: {{ $keys.valkeyPassword }}
      remoteRef: { key: {{ $remoteKey | quote }}, property: {{ $es.properties.valkeyPassword | quote }} }
    {{- end }}
    {{- range .Values.secrets.extra }}
    - secretKey: {{ .key }}
      remoteRef: { key: {{ $remoteKey | quote }}, property: {{ .property | default .key | quote }} }
    {{- end }}
{{- end }}
