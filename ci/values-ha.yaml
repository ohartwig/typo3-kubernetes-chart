# High availability: more replicas spread across zones and nodes, Valkey on a
# volume, database backups off the cluster, an issuer shared with the database
# operator instead of a per-release CA.
#
# Not covered: Valkey stays a single instance. The chart has no replication
# for it, so a Valkey restart is a short cache warm-up and, without the
# volume, logs every editor out. Run a replicated Valkey outside the chart
# (valkey.enabled: false) if that is not acceptable.
image:
  repository: registry.example.org/tenant-a/typo3-runtime
  tag: "8.4-frankenphp"
code:
  artifact: registry.example.org/tenant-a/typo3-code@sha256:2222222222222222222222222222222222222222222222222222222222222222
  verify:
    existingConfigMap: release-signing-key
ingress:
  className: nginx
  host: typo3.example.org
app:
  replicaCount: 3
  resources:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { memory: 1536Mi }
  # Soft spread: with DoNotSchedule a failed zone leaves its replacement
  # pods Pending, exactly when they are needed. The scheduler still prefers
  # an even spread; the PodDisruptionBudget keeps drains from emptying a zone.
  topologySpread:
    whenUnsatisfiable: ScheduleAnyway
    topologyKeys:
      - topology.kubernetes.io/zone
      - kubernetes.io/hostname
podDisruptionBudget:
  maxUnavailable: 1
internalTls:
  issuer:
    create: false
    existing:
      name: tenant-a-internal-ca
      kind: Issuer
secrets:
  existingSecret: typo3-credentials
valkey:
  persistence:
    enabled: true
    size: 1Gi
# Backups leave the cluster: a dump on a PVC next to the database is lost
# with the cluster or the storage it depends on.
backup:
  enabled: true
  target: s3
  retentionDays: 30
  s3:
    endpoint: https://s3.example.org
    region: eu-central-1
    bucket: typo3-backups
    prefix: tenant-a/
    existingSecret: typo3-backup-s3
