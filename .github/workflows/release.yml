# Release on a version tag (v0.1.0): package the chart, push it to the GitHub
# container registry as an OCI artefact, sign it keylessly with cosign and
# publish a GitHub release with the package and the changelog section.
#
# The signature binds the chart to this workflow file and the tag, so users
# can verify it without any key material:
#   cosign verify ghcr.io/ohartwig/charts/typo3-kubernetes-chart:<version> \
#     --certificate-identity-regexp '^https://github\.com/ohartwig/typo3-kubernetes-chart/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # pinup: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.0
  CHART_NAME: typo3-kubernetes-chart
  REGISTRY: ghcr.io
  REPOSITORY: ohartwig/charts

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GitHub release
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Check that the tag matches Chart.yaml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          chart_version="$(helm show chart . | sed -n 's/^version: //p')"
          if [ "v${chart_version}" != "$TAG" ]; then
            echo "Tag $TAG does not match Chart.yaml version $chart_version" >&2
            exit 1
          fi
          echo "version=${chart_version}" >> "$GITHUB_OUTPUT"

      - name: Package
        run: helm package . --destination dist

      - name: Push to the OCI registry
        id: push
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | helm registry login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          helm push "dist/${CHART_NAME}-${VERSION}.tgz" "oci://${REGISTRY}/${REPOSITORY}" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          if [ -z "$digest" ]; then echo "No digest in helm push output" >&2; exit 1; fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | cosign login "$REGISTRY" --username "$REGISTRY_USER" --password-stdin
          cosign sign --yes "${REGISTRY}/${REPOSITORY}/${CHART_NAME}@${DIGEST}"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The changelog section of this version, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "No CHANGELOG section for $VERSION" >&2; exit 1; fi
          gh release create "$TAG" "dist/${CHART_NAME}-${VERSION}.tgz" \
            --title "$TAG" --notes-file notes.md --verify-tag
