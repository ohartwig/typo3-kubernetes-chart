# The same checks as .gitlab-ci.yml: lint, render, schema validation,
# secret scan, plus REUSE compliance.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUBERNETES_VERSION: "1.31.0"
  HELM_VERSION: v4.2.4
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.7.0-alpine
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          helm lint --strict . --kube-version "$KUBERNETES_VERSION"
          for profile in minimal full ha; do
            helm lint --strict . --kube-version "$KUBERNETES_VERSION" -f "ci/values-${profile}.yaml"
          done

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [minimal, full, ha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm template
        run: |
          mkdir -p rendered
          helm template example . --namespace tenant-a \
            --kube-version "$KUBERNETES_VERSION" \
            -f "ci/values-${{ matrix.profile }}.yaml" > "rendered/${{ matrix.profile }}.yaml"
          grep '^kind:' "rendered/${{ matrix.profile }}.yaml" | sort | uniq -c
      - name: kubeconform
        # Core schemas plus the community CRD catalogue (cert-manager, ESO).
        run: |
          docker run --rm -v "$PWD/rendered:/rendered:ro" "$KUBECONFORM_IMAGE" \
            -strict -ignore-missing-schemas -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "/rendered/${{ matrix.profile }}.yaml"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # The release binary, checked against the published checksum. Running
        # the container on a mounted checkout trips git's ownership check.
        run: |
          curl -fsSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
