# Checks for every push to main and every pull request: lint, render,
# schema validation, secret scan and REUSE compliance. Tool versions are
# pinned here and kept current by pinup (.pinup.yaml).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUBERNETES_VERSION: "1.31.0"
  # pinup: datasource=github-releases depName=helm/helm
  HELM_VERSION: v4.3.0
  KUBECONFORM_IMAGE: ghcr.io/yannh/kubeconform:v0.7.0-alpine
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          helm lint --strict . --kube-version "$KUBERNETES_VERSION"
          for profile in minimal full ha; do
            helm lint --strict . --kube-version "$KUBERNETES_VERSION" -f "ci/values-${profile}.yaml"
          done

  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [minimal, full, ha]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm template
        run: |
          mkdir -p rendered
          helm template example . --namespace tenant-a \
            --kube-version "$KUBERNETES_VERSION" \
            -f "ci/values-${{ matrix.profile }}.yaml" > "rendered/${{ matrix.profile }}.yaml"
          grep '^kind:' "rendered/${{ matrix.profile }}.yaml" | sort | uniq -c
      - name: kubeconform
        # Core schemas plus the community CRD catalogue (cert-manager, ESO).
        run: |
          docker run --rm -v "$PWD/rendered:/rendered:ro" "$KUBECONFORM_IMAGE" \
            -strict -ignore-missing-schemas -summary \
            -kubernetes-version "$KUBERNETES_VERSION" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            "/rendered/${{ matrix.profile }}.yaml"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        # The checkout belongs to the runner user, the container runs as
        # another one; mark it safe so git inside the container reads the
        # history instead of refusing it.
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh "$GITLEAKS_IMAGE" -c \
            'git config --global --add safe.directory /repo && gitleaks detect --source /repo --redact --verbose --no-banner'

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0
